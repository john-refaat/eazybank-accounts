server:
  port: 8080
spring:
  application:
    name: accounts
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:accountsdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
        ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  config:
    import:
      - "optional:configserver:http://localhost:8071"

build:
  version: "3.0"