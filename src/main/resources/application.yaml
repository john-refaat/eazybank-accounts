server:
  port: 8080
spring:
  application:
    name: accounts
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:accountsdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active:
      - "qa"

build:
  version: "3.0"

accounts:
  message: "Welcome to Eazy Bank Development API"
  contactDetails:
    name: "John Doe - Technical Lead"
    email: "john.doe@eazybank.com"
  onCallSupport:
    - (555) 555-1234
    - (555) 555-4321
